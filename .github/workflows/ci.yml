name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install CPU torch + project deps
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,safetensors]"
      - name: Lint
        run: ruff check .
      - name: Compile check
        run: python -m compileall -q .
      - name: Unit tests
        run: python -m pytest -v -m "not slow"
      - name: Quality gate protocol (tiny, CPU-honest)
        run: python scripts/quality_gate.py --seeds 0 --train-steps 2 --mode protocol
      - name: Pipeline smoke check
        run: python scripts/gpu_smoke.py --seeds 0 --steps 2
